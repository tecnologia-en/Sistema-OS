    # Enfoque OS installer: temporary personal-file backup over authenticated HTTPS.
    # Independent of the remote computer/agent routes.
    location ^~ /enfoque-os-install-backup/ {
        client_max_body_size 46g;
        client_body_timeout 1800s;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:43210/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 15s;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_cache off;
        access_log off;
        add_header Cache-Control "no-store" always;
    }
