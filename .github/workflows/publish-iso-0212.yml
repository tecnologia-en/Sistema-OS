name: Publicar Enfoque OS 0.2.12 - laboratorio
on:
  push:
    branches:
      - feat/lowram-kiosk-028
    paths:
      - '.github/workflows/publish-iso-0212.yml'
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Aguardar compilacao aprovada
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch 41646871762 --repo "$GITHUB_REPOSITORY" --exit-status --interval 15
      - name: Baixar artefato exato da versao
        uses: actions/download-artifact@v4
        with:
          name: enfoque-os-iso-45
          path: dist
          repository: tecnologia-en/Sistema-OS
          run-id: 41646871762
          github-token: ${{ github.token }}
      - name: Validar checksum antes de publicar
        run: |
          set -euo pipefail
          test -s dist/enfoque-os-0.2.12-piloto-amd64.iso
          test -s dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Separar ISO em partes verificaveis
        run: |
          set -euo pipefail
          mkdir -p parts
          split --bytes=750m --numeric-suffixes=0 --suffix-length=2 dist/enfoque-os-0.2.12-piloto-amd64.iso parts/chunk-
          test "$(find parts -maxdepth 1 -type f -name 'chunk-*' | wc -l)" -ge 2
          (cd parts && sha256sum chunk-* > SHA256_PARTS && sha256sum -c SHA256_PARTS)
          cp dist/SHA256SUMS parts/SHA256SUMS
      - name: Publicar prerelease QA sem dados financeiros
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.2.12-piloto \
            --repo "$GITHUB_REPOSITORY" \
            --target 57aa14f66dcbe320ad1e729989aa2596b6a5faec \
            --title 'Enfoque OS 0.2.12 - Agente Linux e atalhos confiaveis (piloto)' \
            --notes 'ISO piloto Debian 13 XFCE com agente Linux Root MCP de registro automatico e comandos de diagnostico apos aprovacao TI. MeshCentral recebe instalacao individual somente apos pareamento por maquina, sem segredos embutidos. Atalhos SIGE e Intranet confiaveis sem bypass geral de seguranca; desktop Lixeira, SIGE e Intranet. LibreOffice, AnyDesk e PayGo DEMO mantidos. Juntar chunk-00 em ordem e verificar SHA256SUMS. Controle remoto e uso financeiro em lojas ainda requerem homologacao operacional.' \
            --prerelease \
            parts/chunk-* parts/SHA256SUMS parts/SHA256_PARTS
