name: Build Enfoque OS ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/paygo-wine-os-027
      - feat/lowram-kiosk-028
      - feature/canfoque-v2-iso-048
      - feature/printer-plugplay-050
    paths:
      - 'config/**'
      - 'scripts/build-iso.sh'
      - 'scripts/check-project.sh'
      - 'test/test_release_043.py'
      - 'test/test_release_044.py'
      - 'test/test_release_045.py'
      - 'test/test_release_046.py'
      - 'test/test_release_047.py'
      - 'test/test_printer_autosetup_050.py'
      - 'test/test_storage_detection_047.py'
      - 'test/test_release_048.py'
      - 'test/test_print_pages_048.py'
      - 'scripts/stage-canfoque-iso.sh'
      - 'test/xfce_kiosk_probe.c'
      - 'scripts/test-xfce-kiosk-policy.sh'
      - 'scripts/test-xfce-diversion.sh'
      - 'src/**'
      - 'scripts/build-thermal-raster.sh'
      - 'scripts/test-thermal-raster.sh'
      - 'test/thermal_raster_fixture.c'
      - 'docs/RELEASE_046_PORTAL_PANEL_LOCK.md'
      - 'docs/RELEASE_047_ARMAZENAMENTO_INSTALADOR.md'
      - 'test/zero-touch-monitora.test.mjs'
      - '.github/workflows/build-iso.yml'

permissions:
  contents: write

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Stage pinned and verified Canfoque/RustDesk binaries
        run: bash scripts/stage-canfoque-iso.sh

      - name: Compile Debian 13 thermal filter before host tests
        run: |
          # The CUPS thermal raster binary is reproducibly built, not stored in Git.
          docker run --rm \
            --mount type=bind,source="$GITHUB_WORKSPACE",target=/workspace \
            --workdir /workspace \
            --env DEBIAN_FRONTEND=noninteractive \
            debian:trixie bash -euc '
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends gcc python3 libcupsimage2-dev pkg-config xfconf libxfconf-0-3 libxfconf-0-dev dbus-x11 xfce4-settings
              bash scripts/build-thermal-raster.sh
              gcc -std=c11 -Wall -Wextra -Werror -O2 -o /tmp/enfoque-xfce-kiosk-probe test/xfce_kiosk_probe.c $(pkg-config --cflags --libs libxfconf-0)
              bash scripts/test-xfce-diversion.sh
              bash scripts/test-xfce-kiosk-policy.sh
            '

      - name: Check project on host
        run: bash scripts/check-project.sh

      - name: Validate complete test suite before ISO build
        run: python3 -m unittest discover -s test -p 'test_*.py' -q

      - name: Validate Zero Touch enrollment and tunnel security
        run: |
          set -euo pipefail
          node --test test/zero-touch-registry.test.mjs test/zero-touch-monitora.test.mjs
          node --check server/zero-touch-routes.mjs
          node --check server/zero-touch-provisioner.mjs
          python3 -m py_compile config/includes.chroot/usr/local/sbin/enfoque-zero-touch
          python3 -m py_compile config/includes.chroot/usr/local/sbin/enfoque-tunnel
          bash -n scripts/setup-zero-touch-vps.sh
          test -s config/includes.chroot/etc/enfoque-ssh/vps-known-hosts
          test -s config/includes.chroot/etc/sudoers.d/97-enfoque-ti

      - name: Build ISO with Debian 13 in a disposable container
        run: |
          # Keep build tooling on Debian 13, matching our verified VM.
          # Privileged container is limited to this trusted main-branch CI job.
          docker run --rm --privileged \
            --mount type=bind,source="$GITHUB_WORKSPACE",target=/workspace \
            --workdir /workspace \
            --env DEBIAN_FRONTEND=noninteractive \
            debian:trixie bash -euxc '
              apt-get update
              apt-get install -y --no-install-recommends \
                live-build debootstrap squashfs-tools xorriso \
                syslinux-common isolinux grub-pc-bin grub-efi-amd64-bin \
                mtools dosfstools ca-certificates git python3 \
                build-essential pkg-config patch libxi-dev libx11-dev \
                libcupsimage2-dev \
                libice-dev libwnck-3-dev xfce4-dev-tools libxfce4ui-2-dev \
                libxfce4panel-2.0-dev libxfce4windowing-0-dev intltool
              bash scripts/check-project.sh
              bash scripts/build-iso.sh
            '

      - name: Verify checksums
        run: |
          cd dist
          sha256sum -c SHA256SUMS

      - name: Validate versioned Enfoque APT package
        run: |
          set -euo pipefail
          pkg=$(find config/packages.chroot -maxdepth 1 -name 'enfoque-os-core_*.deb' -print -quit)
          test -s "$pkg"
          test "$(dpkg-deb -f "$pkg" Package)" = 'enfoque-os-core'
          version=$(sed -n 's/^VERSION="\([^"]*\)"/\1/p' config/includes.chroot/etc/enfoque-os-release)
          revision=$(sed -n 's/^PACKAGE_REVISION="\([1-9][0-9]*\)"/\1/p' config/includes.chroot/etc/enfoque-os-release)
          test "$(dpkg-deb -f "$pkg" Version)" = "${version}-${revision:-1}"
          dpkg-deb --contents "$pkg" > "$RUNNER_TEMP/enfoque-core-package-contents.txt"
          grep -Fq 'usr/local/sbin/enfoque-update' "$RUNNER_TEMP/enfoque-core-package-contents.txt"
          grep -Fq 'etc/xdg/mimeapps.list' "$RUNNER_TEMP/enfoque-core-package-contents.txt"
          for required in etc/xdg/xfce4/kiosk/kioskrc etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xfce4-panel.xml etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml; do
            grep -Fq "$required" "$RUNNER_TEMP/enfoque-core-package-contents.txt"
          done
          for required in usr/local/sbin/enfoque-plugplay usr/local/sbin/enfoque-thermal-print usr/local/libexec/enfoque-thermal-raster-trim usr/lib/cups/filter/enfoque-thermal-raster etc/udev/rules.d/89-enfoque-plugplay.rules etc/enfoque-os/drivers/catalog.json; do
            grep -Fq "$required" "$RUNNER_TEMP/enfoque-core-package-contents.txt"
          done
          dependencies=$(dpkg-deb -f "$pkg" Depends)
          for required in xarchiver thunar-archive-plugin 7zip zip unzip bluez blueman pulseaudio-module-bluetooth xdg-desktop-portal xdg-desktop-portal-gtk; do
            printf '%s\n' "$dependencies" | tr ',' '\n' | grep -Eq "^[[:space:]]*${required}([[:space:]]|\\(|$)"
          done
          grep -Fq 'usr/local/sbin/enfoque-zero-touch' "$RUNNER_TEMP/enfoque-core-package-contents.txt"
          grep -Fq 'usr/local/sbin/enfoque-tunnel' "$RUNNER_TEMP/enfoque-core-package-contents.txt"
          grep -Fq 'usr/local/sbin/enfoque-live-session' "$RUNNER_TEMP/enfoque-core-package-contents.txt"
          # All 0.2.28 capabilities must be present in the signed APT update.
          for component in \
            usr/local/lib/enfoque-session/bridge.py \
            usr/local/bin/enfoque-session-agent \
            usr/local/bin/enfoque-remote-agent \
            usr/local/bin/enfoque-desktop-shell \
            usr/local/sbin/enfoque-hardware-setup \
            usr/local/bin/enfoque-bateria-painel \
            usr/local/bin/enfoque-bateria-migrar \
            etc/xdg/autostart/enfoque-bateria-migrar.desktop; do
            grep -Fq "$component" "$RUNNER_TEMP/enfoque-core-package-contents.txt"
          done
          grep -Fq 'etc/systemd/system/enfoque-live-session.service' "$RUNNER_TEMP/enfoque-core-package-contents.txt"
          # The .deb is installed into the chroot before the Live boot; do not
          # consume UID 1000 by creating an admin account from its postinst.
          dpkg-deb --ctrl-tarfile "$pkg" | tar -xOf - ./postinst > "$RUNNER_TEMP/enfoque-core-postinst"
          if grep -Eq '(^|[[:space:]])(useradd|adduser|newusers)[[:space:]]' "$RUNNER_TEMP/enfoque-core-postinst"; then
            echo 'ERROR: core postinst creates a user before Live boot' >&2
            exit 1
          fi
          grep -Fq 'systemctl enable enfoque-live-session.service' config/hooks/normal/104-enfoque-live-autologin.hook.chroot

      - name: Upload signed-repo-ready APT core package
        uses: actions/upload-artifact@v4
        with:
          name: enfoque-os-core-${{ github.run_number }}
          path: config/packages.chroot/enfoque-os-core_*.deb
          retention-days: 14
          if-no-files-found: error

      - name: Split verified ISO into variable-count 350 MiB chunks
        run: |
          set -euo pipefail
          iso=$(find dist -maxdepth 1 -type f -name '*.iso' -print -quit)
          test -n "$iso" && test -s "$iso"
          (cd dist && sha256sum -c SHA256SUMS)
          mkdir -p parts
          split --bytes=350m --numeric-suffixes=0 --suffix-length=3 "$iso" parts/chunk-
          count=$(find parts -maxdepth 1 -type f -name 'chunk-*' | wc -l)
          test "$count" -ge 1 && test "$count" -le 99
          cp dist/SHA256SUMS parts/SHA256SUMS
          (cd parts && sha256sum chunk-* > SHA256_PARTS && sha256sum -c SHA256_PARTS)
          version=$(sed -n 's/^VERSION="\([^"]*\)"/\1/p' config/includes.chroot/etc/enfoque-os-release)
          cat > parts/LEIA-ME.txt <<EOF
          ENFOQUE OS ${version} — ISO completa em partes (GitHub Releases)
          A ISO foi gerada e verificada no GitHub Actions, sem baixar em nenhum PC.

          Os arquivos chunk-000, chunk-001, ... compoem UMA unica ISO.
          Mantenha todas as partes na mesma pasta e, no Linux, execute:
            cat chunk-* > enfoque-os-${version}-piloto-amd64.iso
            sha256sum -c SHA256SUMS
          Verifique tambem:
            sha256sum -c SHA256_PARTS

          ISO de teste/piloto: exige validacao em maquina descartavel antes de lojas.
          Backup, drivers, recuperacao e agente remoto dependem de configuracoes
          e autorizacoes individuais; rollback de boot automatico NAO foi homologado.
          EOF

      - name: Upload full ISO and checksums to GitHub Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: enfoque-os-iso-full-${{ github.run_number }}
          path: |
            dist/*.iso
            dist/SHA256SUMS
          retention-days: 14
          if-no-files-found: error

      - name: Upload every ISO chunk and integrity manifest
        uses: actions/upload-artifact@v4
        with:
          name: enfoque-os-iso-parts-${{ github.run_number }}
          path: parts/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

      - name: Publish complete ISO chunks permanently as a GitHub prerelease
        if: github.event_name == 'push' && (github.ref == 'refs/heads/feat/lowram-kiosk-028' || github.ref == 'refs/heads/feature/canfoque-v2-iso-048' || github.ref == 'refs/heads/feature/printer-plugplay-050')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^VERSION="\([^"]*\)"/\1/p' config/includes.chroot/etc/enfoque-os-release)
          tag="enfoque-os-v${version}-run${GITHUB_RUN_NUMBER}"
          gh release create "$tag" parts/chunk-* parts/SHA256SUMS parts/SHA256_PARTS parts/LEIA-ME.txt \
            --target "$GITHUB_SHA" \
            --title "Enfoque OS ${version} — ISO Piloto (build ${GITHUB_RUN_NUMBER})" \
            --notes "ISO de teste compilada no GitHub Actions e distribuida em partes verificaveis. Leia LEIA-ME.txt antes de reconstruir. Nao distribuir para PCs de caixa sem homologacao." \
            --prerelease
