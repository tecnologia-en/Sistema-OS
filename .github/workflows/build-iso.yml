name: Build Enfoque OS ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/paygo-wine-os-027
      - feat/lowram-kiosk-028
    paths:
      - 'config/**'
      - 'scripts/build-iso.sh'
      - 'scripts/check-project.sh'
      - '.github/workflows/build-iso.yml'

permissions:
  contents: read

concurrency:
  group: build-iso
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check project on host
        run: bash scripts/check-project.sh

      - name: Validate complete test suite before ISO build
        run: python3 -m unittest discover -s test -p 'test_*.py' -q

      - name: Build ISO with Debian 13 in a disposable container
        run: |
          # Keep build tooling on Debian 13, matching our verified VM.
          # Privileged container is limited to this trusted main-branch CI job.
          docker run --rm --privileged \
            --mount type=bind,source="$GITHUB_WORKSPACE",target=/workspace \
            --workdir /workspace \
            --env DEBIAN_FRONTEND=noninteractive \
            debian:trixie bash -euxc '
              apt-get update
              apt-get install -y --no-install-recommends \
                live-build debootstrap squashfs-tools xorriso \
                syslinux-common isolinux grub-pc-bin grub-efi-amd64-bin \
                mtools dosfstools ca-certificates git python3
              bash scripts/check-project.sh
              bash scripts/build-iso.sh
            '

      - name: Verify checksums
        run: |
          cd dist
          sha256sum -c SHA256SUMS

      - name: Validate versioned Enfoque APT package
        run: |
          set -euo pipefail
          pkg=$(find config/packages.chroot -maxdepth 1 -name 'enfoque-os-core_*.deb' -print -quit)
          test -s "$pkg"
          test "$(dpkg-deb -f "$pkg" Package)" = 'enfoque-os-core'
          test "$(dpkg-deb -f "$pkg" Version)" = '0.2.21-1'
          dpkg-deb --contents "$pkg" | grep -q 'usr/local/sbin/enfoque-update'

      - name: Upload signed-repo-ready APT core package
        uses: actions/upload-artifact@v4
        with:
          name: enfoque-os-core-${{ github.run_number }}
          path: config/packages.chroot/enfoque-os-core_*.deb
          retention-days: 14
          if-no-files-found: error

      - name: Upload ISO and checksums
        uses: actions/upload-artifact@v4
        with:
          name: enfoque-os-iso-${{ github.run_number }}
          path: |
            dist/*.iso
            dist/SHA256SUMS
          retention-days: 7
          if-no-files-found: error

      - name: Split verified ISO into 350 MiB chunks
        run: |
          set -euo pipefail
          iso=$(find dist -maxdepth 1 -type f -name '*.iso' -print -quit)
          test -n "$iso" && test -s "$iso"
          (cd dist && sha256sum -c SHA256SUMS)
          mkdir -p parts
          split --bytes=350m --numeric-suffixes=0 --suffix-length=2 "$iso" parts/chunk-
          test "$(find parts -maxdepth 1 -type f -name 'chunk-*' | wc -l)" -eq 7
          cp dist/SHA256SUMS parts/SHA256SUMS
          (cd parts && sha256sum chunk-* > SHA256_PARTS && sha256sum -c SHA256_PARTS)

      - name: Upload split manifest
        uses: actions/upload-artifact@v4
        with:
          name: enfoque-os-parts-manifest-${{ github.run_number }}
          path: |
            parts/SHA256SUMS
            parts/SHA256_PARTS
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Upload chunk 00
        uses: actions/upload-artifact@v4
        with:
          name: enfoque-os-chunk-00-${{ github.run_number }}
          path: parts/chunk-00
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Upload chunk 01
        uses: actions/upload-artifact@v4
        with:
          name: enfoque-os-chunk-01-${{ github.run_number }}
          path: parts/chunk-01
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Upload chunk 02
        uses: actions/upload-artifact@v4
        with:
          name: enfoque-os-chunk-02-${{ github.run_number }}
          path: parts/chunk-02
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Upload chunk 03
        uses: actions/upload-artifact@v4
        with:
          name: enfoque-os-chunk-03-${{ github.run_number }}
          path: parts/chunk-03
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Upload chunk 04
        uses: actions/upload-artifact@v4
        with:
          name: enfoque-os-chunk-04-${{ github.run_number }}
          path: parts/chunk-04
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Upload chunk 05
        uses: actions/upload-artifact@v4
        with:
          name: enfoque-os-chunk-05-${{ github.run_number }}
          path: parts/chunk-05
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Upload chunk 06
        uses: actions/upload-artifact@v4
        with:
          name: enfoque-os-chunk-06-${{ github.run_number }}
          path: parts/chunk-06
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
