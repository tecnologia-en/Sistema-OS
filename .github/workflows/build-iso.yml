name: Build Enfoque OS ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'config/**'
      - 'scripts/build-iso.sh'
      - 'scripts/check-project.sh'
      - '.github/workflows/build-iso.yml'

permissions:
  contents: read

concurrency:
  group: build-iso
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso syslinux-common isolinux grub-pc-bin grub-efi-amd64-bin mtools dosfstools ca-certificates

      - name: Check project
        run: bash scripts/check-project.sh

      - name: Build ISO
        run: sudo bash scripts/build-iso.sh

      - name: Verify checksums
        run: |
          cd dist
          sha256sum -c SHA256SUMS

      - name: Upload ISO and checksums
        uses: actions/upload-artifact@v4
        with:
          name: enfoque-os-iso-${{ github.run_number }}
          path: |
            dist/*.iso
            dist/SHA256SUMS
          retention-days: 7
          if-no-files-found: error
