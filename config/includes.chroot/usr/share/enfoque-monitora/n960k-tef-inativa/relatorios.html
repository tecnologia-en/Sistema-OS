<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <style>
    body{font-family:Arial,sans-serif;min-width:360px;padding:12px;color:#0f172a}
    h3{margin:0 0 8px}
    label{display:block;font-size:12px;font-weight:700;margin-top:10px}
    input{width:100%;box-sizing:border-box;padding:8px;border:1px solid #cbd5e1;border-radius:8px;margin-top:4px}
    button{padding:8px 10px;border:0;border-radius:8px;background:#0f172a;color:white;font-weight:700;margin-top:10px;cursor:pointer}
    button.secondary{background:#334155}
    .row{display:flex;gap:8px;flex-wrap:wrap}
    pre{white-space:pre-wrap;font-size:12px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:8px;max-height:180px;overflow:auto}
    .hint{font-size:12px;color:#475569;line-height:1.35}
  </style>
</head>
<body>
  <h3>Enfoque MeuSIGE</h3>
  <p class="hint">Você pode colar o GitHub PAT aqui ou editar o arquivo <b>github_pat.txt</b> dentro da pasta da extensão antes de carregar no Chrome. O PAT precisa ter escrita no repo <b>tecnologia-en/bearer-token</b>.</p>

  <label>GitHub PAT</label>
  <input id="githubToken" type="password" placeholder="ghp_... ou github_pat_...">

  <div class="row">
    <button id="save">Salvar PAT</button>
    <button id="capture" class="secondary">Capturar agora</button>
  </div>

  <pre id="out">Carregando...</pre>

  <script>
    const out = document.getElementById('out');
    const input = document.getElementById('githubToken');

    function show(obj){ out.textContent = typeof obj === 'string' ? obj : JSON.stringify(obj || {}, null, 2); }

    chrome.runtime.sendMessage({type:'get-config'}, (r)=>{
      if (r && r.githubTokenPrefix) input.placeholder = r.githubTokenPrefix + '... já salvo';
      show(r || {});
    });

    document.getElementById('save').onclick = () => {
      const token = input.value.trim();
      if (!/^(ghp_|github_pat_)/i.test(token)) {
        show({ok:false, error:'Cole um GitHub PAT válido começando com ghp_ ou github_pat_'});
        return;
      }
      chrome.runtime.sendMessage({type:'save-config', githubToken:token}, (r)=>{
        input.value = '';
        show(r || {});
      });
    };

    document.getElementById('capture').onclick = () => {
      show('Capturando...');
      chrome.runtime.sendMessage({type:'capture-now'}, (r)=>show(r || {}));
    };
  </script>
</body>
</html>
