# Enfoque OS 1.0.0: global gentle transitions with CPU-friendly backend.
backend = "xrender";
vsync = false;
use-damage = true;
shadow = false;
fading = true;
fade-delta = 12;
fade-in-step = 0.085;
fade-out-step = 0.11;
no-fading-openclose = false;
detect-rounded-corners = true;
detect-client-opacity = true;
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
unredir-if-possible = false;
fade-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dock'",
  "class_g = 'xfce4-notifyd'"
];
