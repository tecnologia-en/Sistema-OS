# Enfoque OS — SSH administrative access (separate from AnyDesk).
# Only local endpoint; access from the VPS requires a separately approved
# and authenticated network route (not supplied by the diagnostic agent).
ListenAddress 127.0.0.1
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
AuthorizedKeysFile /etc/enfoque-ssh/authorized_keys
AllowUsers enfoque-ti
AllowTcpForwarding no
AllowAgentForwarding no
X11Forwarding no
PermitTunnel no
PermitUserEnvironment no
GatewayPorts no
MaxAuthTries 3
LoginGraceTime 30
LogLevel VERBOSE
