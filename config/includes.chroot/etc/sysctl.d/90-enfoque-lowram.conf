# Enfoque OS: responsive 2 GiB XFCE kiosk with high-priority LZ4 zram.
# Do not disable disk journaling or fsync for payment state.
vm.swappiness = 120
vm.page-cluster = 0
vm.vfs_cache_pressure = 100
vm.dirty_background_ratio = 3
vm.dirty_ratio = 10
vm.dirty_expire_centisecs = 1000
vm.dirty_writeback_centisecs = 500
